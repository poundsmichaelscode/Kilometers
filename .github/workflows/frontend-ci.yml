name: Frontend CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Detect web app
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Web app not initialized yet. Frontend checks not run."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Require lockfile and test scripts
        if: steps.detect.outputs.present == 'true'
        run: |
          test -f package-lock.json || { echo "::error::Commit apps/web/package-lock.json"; exit 1; }
          node -e "const s=require('./package.json').scripts||{};for(const x of ['lint','test','build']) if(!s[x]) {console.error('Missing npm script: '+x);process.exitCode=1}"
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint
      - name: Test
        if: steps.detect.outputs.present == 'true'
        env:
          CI: "true"
        run: npm test -- --run
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build
      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.detect.outputs.present }}" = "true" ]; then
            echo "Web app detected; review step statuses above." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Web app not initialized: CI scaffold only, **no tests executed**." >> "$GITHUB_STEP_SUMMARY"
          fi

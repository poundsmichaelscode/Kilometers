name: Frontend CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main, feat/web-complete-mvp]
    paths:
      - 'apps/web/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Web lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    env:
      CI: "true"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8010/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Strict lint validation
        run: npm run lint -- --max-warnings=0

      - name: Automated tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: TypeScript validation
        run: npm run typecheck

      - name: Validation summary
        if: success()
        run: |
          echo "## Frontend CI passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dependency installation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Strict ESLint validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- TypeScript validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automated frontend tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production build" >> "$GITHUB_STEP_SUMMARY"

name: Backend CI

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Django checks and tests (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kilometer
          POSTGRES_PASSWORD: kilometer_ci_only
          POSTGRES_DB: kilometer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kilometer -d kilometer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgis://kilometer:kilometer_ci_only@127.0.0.1:5432/kilometer_test
      DJANGO_SECRET_KEY: ci-only-not-for-production-change-me
      SECRET_KEY: ci-only-not-for-production-change-me
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CI: 'true'
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - name: Detect Django app
        id: detect
        run: |
          if [ -f manage.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Django project not initialized yet. Backend checks not run."
          fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt
      - name: Install system dependencies
        if: steps.detect.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - name: Install backend dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "::error::Add requirements.txt or requirements-dev.txt"; exit 1
          fi
          python -m pip install pytest pytest-django
      - name: Django system checks
        if: steps.detect.outputs.present == 'true'
        run: python manage.py check
      - name: Migrations are up to date
        if: steps.detect.outputs.present == 'true'
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        if: steps.detect.outputs.present == 'true'
        run: python -m pytest -q
      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.detect.outputs.present }}" = "true" ]; then
            echo "Django app detected; review step statuses above." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Django app not initialized: CI scaffold only, **no tests executed**." >> "$GITHUB_STEP_SUMMARY"
          fi

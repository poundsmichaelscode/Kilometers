name: Backend CI

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'infra/docker/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, feat/backend-journeys-integration]
    paths:
      - 'apps/backend/**'
      - 'infra/docker/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django checks, migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kilometer
          POSTGRES_PASSWORD: kilometer_ci_only
          POSTGRES_DB: kilometer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kilometer -d kilometer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production-kilometer-validation-key
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: kilometer_test
      POSTGRES_USER: kilometer
      POSTGRES_PASSWORD: kilometer_ci_only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      CI: 'true'

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt

      - name: Install GIS system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify database connectivity
        run: |
          python manage.py shell -c \
            "from django.db import connection; c = connection.cursor(); c.execute('SELECT PostGIS_Version()'); print(c.fetchone()[0]); c.close()"

      - name: Django system checks
        run: python manage.py check

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Run Django automated tests
        run: python manage.py test --verbosity 2 --noinput

      - name: Generate OpenAPI schema
        run: |
          python manage.py spectacular \
            --file /tmp/kilometer-openapi.yaml \
            --validate --fail-on-warn

      - name: Validation summary
        if: success()
        run: |
          echo "## Backend CI passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python dependency validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgreSQL/PostGIS connectivity" >> "$GITHUB_STEP_SUMMARY"
          echo "- Django system checks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database migration validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automated backend tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- OpenAPI schema generation" >> "$GITHUB_STEP_SUMMARY"
